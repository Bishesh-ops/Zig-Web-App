name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: step-security/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run tests
        run: zig build test
